[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wittenberg-backend"
version = "0.1.0"
description = "Service d'inférence pour l'identification de fréquences à partir de motifs de Chladni"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "numpy==2.5.2",
]

[project.optional-dependencies]
# Runtime ONNX — recommandé, compatible Python 3.11 → 3.14.
onnx = ["onnxruntime==1.28.0"]
# Détection de plaque, correction de perspective, Canny.
cv = ["opencv-python-headless==5.0.0.93"]
# Runtime Keras/TensorFlow — NÉCESSITE Python <= 3.13 (aucune roue pour 3.14).
keras = ["tensorflow==2.20.0"]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.3",
    "mypy==2.3.0",
    "onnx==1.22.0",
]

[project.scripts]
wittenberg-preprocess = "wittenberg.tools.preprocess_cli:main"
wittenberg-evaluate = "wittenberg.tools.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008 : FastAPI déclare ses dépendances par appel dans la signature.
ignore = ["B008"]
# Typographie française : ces caractères sont voulus, pas des homoglyphes.
allowed-confusables = ["×", "–", "—", "’", "«", "»", "’"]

[tool.ruff.lint.isort]
known-first-party = ["wittenberg", "tests"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
